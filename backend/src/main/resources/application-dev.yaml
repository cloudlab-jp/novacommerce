server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/novacommerce
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  api-docs:
    path: /api/docs

  swagger-ui:
    path: /swagger
    operationsSorter: method
    tagsSorter: alpha